name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Make sure webDir exists
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || echo "<html></html>" > dist/index.html

      - name: Add Android platform if missing
        run: '[ -d android ] || npx cap add android'

      - name: Check icon source
        run: |
          ls -la assets
          sudo apt-get install -y imagemagick
          identify assets/icon-only.png

      - name: Put icon into Android project
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}
            s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            for n in ic_launcher ic_launcher_round; do
              convert assets/icon-only.png -resize ${s}x${s} $RES/mipmap-$d/$n.png
            done
          done
          echo "--- icons written ---"
          ls -la $RES/mipmap-*

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Uniloop.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Uniloop (latest)
          files: Uniloop.apk
